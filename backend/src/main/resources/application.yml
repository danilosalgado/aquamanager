spring:
  application:
    name: aquamanager-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aquamanager}
    username: ${DB_USERNAME:aquamanager}
    password: ${DB_PASSWORD:aquamanager}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 15
      pool-name: aquamanager-hikari

  jpa:
    # true (padrão do Spring Boot): mantém a sessão Hibernate aberta durante toda a
    # requisição. Necessário aqui porque os mappers (ex.: TanqueMapper.fotos,
    # LoteMapper.tanqueNome/especieNome, LancamentoMapper.clienteNome/fornecedorNome)
    # acessam associações @ManyToOne/@OneToMany LAZY na camada de apresentação, fora da
    # transação do service. A alternativa (mapear para DTO dentro de cada service, ou
    # usar @EntityGraph/JOIN FETCH em cada repositório) foi avaliada, mas exigiria tocar
    # em todos os módulos; OSIV=true resolve de forma uniforme ao custo de manter a
    # conexão JDBC associada à requisição por mais tempo — aceitável na escala atual.
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  # PORT é injetada automaticamente por PaaS como o Railway; BACKEND_PORT continua
  # valendo para docker-compose local, e 8080 é o último fallback.
  port: ${PORT:${BACKEND_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false # evita testar a conexão SMTP no health check; e-mail usa ConsoleEmailSender por padrão (app.email.enabled=false)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.aquamanager: INFO
    org.hibernate.SQL: WARN

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-only-secret-change-me-in-every-other-environment-1234567890}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    issuer: ${JWT_ISSUER:aquamanager}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  trial-days: ${TRIAL_DAYS:14}

  asaas:
    enabled: ${ASAAS_ENABLED:false}
    api-key: ${ASAAS_API_KEY:}
    base-url: ${ASAAS_BASE_URL:https://sandbox.asaas.com/api/v3}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}

  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-id: ${STRIPE_PRICE_ID:}

  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:no-reply@aquamanager.app}

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}
    secret: ${GOOGLE_CLIENT_SECRET:}
  redirect:
    uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/integracoes/google/callback}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-flash-latest}

openweathermap:
  api:
    key: ${OPENWEATHERMAP_API_KEY:}
